# Render.com blueprint: Web Service for Streamlit
# https://render.com/docs/deploy-streamlit
services:
  - type: web
    name: isys812-customer-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_dashboard_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
